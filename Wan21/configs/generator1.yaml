# Use: bash Wan21/scripts/train.sh generator1 / bash Wan21/scripts/infer.sh generator1
# gpus: explicit selection; availability is not auto-detected. Accumulation is derived from effective_batch_size.
# relora: false preserves initial_adapter A/B; true merges once at phase start and initializes new A/B.
gpus:
- 2
- 3
effective_batch_size: 4
relora: false
generator_ckpt: /root/data/mcy/timeOPD/minWM/ckpts/Wan21/Action2V/dmd/model.pt
generator_checkpoint_key: generator
# Frozen Guider1 from the new 20-step run; model.pt already includes its LoRA.
guider_ckpt: /root/data/ltl/timeOPD/minWM/logs/Wan21/Action2V/guider1_20step_20261019_150824_181508/checkpoint_001425/model.pt
guider_checkpoint_key: generator
guider_adapter_ckpt: null
model_path: /root/data/mcy/timeOPD/minWM/Wan21/wan_models/Wan2.1-T2V-1.3B
annotation_path: /root/data/mcy/timeOPD/minWM/dataset/selector_iter1.json
split_manifest: /root/data/mcy/timeOPD/minWM/dataset/Wan21/Action2V/guider_sft_iter1/manifest.json
dataset_split: train
missing_attributes: keep
condition_format: guider_sft
prompt_attribute_template: '{prompt}

